<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grouping GA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="hero">
    <nav><a class="brand" href="/">Grouping GA</a><span>班分け最適化ツール</span></nav>
    <div class="hero-copy"><p class="eyebrow">GENETIC GROUPING</p><h1>相性を、いい班分けに。</h1><p>参加者同士の相性を入力すると、遺伝的アルゴリズムが班内スコアの高い組み合わせを探索します。</p></div>
  </header>
  <main>
    {% if error %}<div class="alert" role="alert"><strong>入力を確認してください</strong><span>{{ error }}</span></div>{% endif %}
    <form action="{{ url_for('optimize') }}" method="post" enctype="multipart/form-data" id="ga-form">
      <section class="card"><div class="step">01</div><div class="section-title"><h2>参加者と班の条件</h2><p>1行に1名ずつ入力してください。</p></div>
        <div class="form-grid"><label class="wide">参加者名<textarea id="names" name="names" rows="8" required placeholder="佐藤\n鈴木\n高橋">{{ form.names if form else '' }}</textarea></label>
          <div class="fields"><label>班数<input id="group-count" name="group_count" type="number" min="1" value="{{ form.group_count if form else 3 }}" required></label><label>1班あたり<input id="group-size" name="group_size" type="number" min="1" value="{{ form.group_size if form else 3 }}" required></label><label>乱数シード <span class="optional">任意</span><input name="seed" type="number" value="{{ form.seed if form else 42 }}"></label><button type="button" class="secondary" id="sample">サンプルを使う</button></div>
        </div><p id="count-status" class="status"></p>
      </section>
      <section class="card"><div class="step">02</div><div class="section-title"><h2>相性を入力</h2><p>正：同じ班にしたい／負：離したい／0：指定なし。上三角だけ入力できます。</p></div>
        <div class="upload"><label>CSVから読み込む<input type="file" name="matrix_csv" accept=".csv,text/csv"></label><a href="{{ url_for('static', filename='sample_matrix.csv') }}" download>サンプルCSV</a></div>
        <div id="matrix-wrap" class="matrix-wrap"><p class="empty">参加者名を入力すると、相性表がここに表示されます。</p></div>
      </section>
      <div class="action"><button class="primary" type="submit">最適な班分けを生成 <span>→</span></button><p>入力データは保存されません</p></div>
    </form>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
